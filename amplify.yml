version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
        - cp node_modules/sql.js/dist/sql-wasm.wasm public/sql-wasm.wasm
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
